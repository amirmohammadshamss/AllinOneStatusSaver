pluginManagement {
    repositories {
        def googleMavenUrl = providers.gradleProperty('googleMavenUrl').orNull
        if (googleMavenUrl) maven { url = uri(googleMavenUrl) }
        else google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def googleMavenUrl = providers.gradleProperty('googleMavenUrl').orNull
        if (googleMavenUrl) maven { url = uri(googleMavenUrl) }
        else google()
        mavenCentral()
    }
}
rootProject.name = 'AllInOneStatusSaver'
include ':app'
